name: CI
on: [push, pull_request]

jobs:
  lint:
    name: Lint - Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Vérifier le style
        run: ruff check .
  build:
    name: Build - Vérifier l'application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compiler le code
        run: python -m compileall app
      - name: Importer l'application
        run: python -c "from app.main import app; print(app.title)"
  test:
    name: Test - Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Exécuter les tests
        run: pytest
      - name: Afficher les contextes
        env:
          APP_NAME: fastapi-starter
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          RUNNER_OS: ${{ runner.os }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Application : $APP_NAME"
          echo "Acteur : $ACTOR"
          echo "Événement : $EVENT_NAME"
          echo "Branche / Référence : $BRANCH"
          echo "SHA du commit : $COMMIT_SHA"
          echo "OS du runner : $RUNNER_OS"
          echo "Branche source PR : $HEAD_REF"
          echo "Branche cible PR : $BASE_REF"
      - name: Afficher le contexte GitHub JSON
        run: echo '${{ toJson(github) }}'